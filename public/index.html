<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physik 2 · Herr Beetz</title>
<style>
:root{--night:#17142a;--panel:#221d3b;--line:#3e3768;--ink:#f1ecfa;--muted:#bdb4d8;--candle:#f6b847;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Trebuchet MS","Segoe UI",sans-serif;font-size:clamp(30px,7vw,44px);margin:0;color:var(--candle)}
p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
a.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px}
a.tile:hover,a.tile:focus-visible{border-color:var(--candle);outline:none}
.ic{font-size:40px}
.t{font-weight:800;font-size:20px}
.d{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Physik 2</h1>
  <p>Lernspiele für die 2. Klasse · Herr Beetz</p>
  <div class="grid">
    <a class="tile" href="/spukvilla/"><span class="ic">🎃</span><span class="t">Die Spukvilla</span><span class="d">Halloween-Abenteuer: Wissenschaft, Sehen, Licht und Schatten</span></a>
  </div>
</main>
</body>
</html>
